<helmet data-dc-atomics>
<style>
body { margin: 0; background: #f2efe9; }
a { color: #1f4e46; text-decoration: none; }
a:hover { color: #12332e; text-decoration: underline; }
@keyframes dc-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</helmet>
<div data-screen-label="Release readiness" style="min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:56px 24px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif">
  <section style="width:520px;background:#fffdf8;border:1px solid rgba(31,78,70,.16);border-radius:2px;box-shadow:0 18px 40px -28px rgba(20,40,36,.5);animation:dc-rise .32s ease-out both">
    <header style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:26px 28px 18px;border-bottom:1px solid rgba(31,78,70,.12)">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font:600 21px/1.2 inherit;color:#12332e;letter-spacing:-.01em">Release readiness</span>
        <span style="font:400 13px/1.4 ui-sans-serif,system-ui,sans-serif;color:rgba(18,51,46,.6)">Sprint 24 - cut on Friday</span>
      </div>
      <span style="font:600 12px/1 ui-monospace,Menlo,monospace;color:#12332e;background:rgba(31,78,70,.1);padding:7px 9px;border-radius:2px">{{ readyLabel }}</span>
    </header>
    <ul style="list-style:none;margin:0;padding:10px 12px;display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="4">
        <li style="display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:14px;padding:13px 16px;border-radius:2px;cursor:pointer;transition:background .14s ease" style-hover="background:rgba(31,78,70,.06)">
          <span style="font:500 12px/1 ui-monospace,Menlo,monospace;color:rgba(18,51,46,.45)">{{ item.rank }}</span>
          <span style="display:flex;flex-direction:column;gap:3px">
            <span style="font:500 15px/1.3 ui-sans-serif,system-ui,sans-serif;color:#12332e">{{ item.title }}</span>
            <sc-if value="{{ showOwners }}" hint-placeholder-val="{{ true }}">
              <span style="font:400 12px/1.3 ui-sans-serif,system-ui,sans-serif;color:rgba(18,51,46,.55)">{{ item.owner }}</span>
            </sc-if>
          </span>
          <sc-if value="{{ item.isShipped }}" hint-placeholder-val="{{ false }}">
            <span style="font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:6px 8px;border-radius:2px;color:#fffdf8;background:#1f4e46">Shipped</span>
          </sc-if>
          <sc-if value="{{ item.isReview }}" hint-placeholder-val="{{ false }}">
            <span style="font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:6px 8px;border-radius:2px;color:#fffdf8;background:#8a6a1f">Review</span>
          </sc-if>
          <sc-if value="{{ item.isBlocked }}" hint-placeholder-val="{{ false }}">
            <span style="font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:6px 8px;border-radius:2px;color:#fffdf8;background:#8c2f2a">Blocked</span>
          </sc-if>
        </li>
      </sc-for>
    </ul>
    <footer style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 28px 24px;border-top:1px solid rgba(31,78,70,.12)">
      <span style="font:400 13px/1.4 ui-sans-serif,system-ui,sans-serif;color:rgba(18,51,46,.6)">{{ blockedNote }}</span>
      <button onClick="{{ toggleOwners }}" style="font:500 13px/1 ui-sans-serif,system-ui,sans-serif;color:#fffdf8;background:#1f4e46;border:0;border-radius:2px;padding:11px 15px;cursor:pointer;transition:background .14s ease" style-hover="background:#12332e" style-active="transform:translateY(1px)">{{ ownerButtonLabel }}</button>
    </footer>
  </section>
</div>
